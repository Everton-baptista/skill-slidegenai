name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -B -m unittest discover -s tests -v
      - run: python -B brand-presentations/scripts/validate_brand.py examples/demo-brand/brand-profile.json
      - run: python -B brand-presentations/scripts/validate_deck.py examples/demo-brand/deck-plan.json --brand examples/demo-brand/brand-profile.json
