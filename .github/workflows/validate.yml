name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B slidegenai/scripts/check_installation.py
      - run: python -B slidegenai/scripts/package_skill.py --output dist/slidegenai.zip
      - run: python -B slidegenai/scripts/package_skill.py --profile claude-ai --output dist/slidegenai-claude-ai.zip
      - run: python -B slidegenai/scripts/validate_brand.py examples/demo-brand/brand-profile.json
      - run: python -B slidegenai/scripts/validate_deck.py examples/demo-brand/deck-plan.json --brand examples/demo-brand/brand-profile.json
      - run: python -B slidegenai/scripts/validate_design.py examples/portable-deck/design-system.json --brand examples/portable-deck/brand-profile.json
      - run: python -B slidegenai/scripts/validate_deck.py examples/portable-deck/deck-plan.json --brand examples/portable-deck/brand-profile.json --design examples/portable-deck/design-system.json --require-reviewed
  reproduce-example:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: examples/portable-deck
      - run: node examples/portable-deck/build.mjs --out examples/portable-deck/generated
      - run: python -B examples/portable-deck/check_pptx.py examples/portable-deck/generated/example.pptx
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: examples/analytical-patterns
      - run: node examples/analytical-patterns/build.mjs --out examples/analytical-patterns/generated
      - run: python -B examples/analytical-patterns/check_pptx.py examples/analytical-patterns/generated/example.pptx

  adaptive-kit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: slidegenai/assets/visual-kit
      - run: node --test tests/test_visual_kit.mjs
        env:
          SLIDEGENAI_NATIVE_KIT: ${{ github.workspace }}/slidegenai/assets/visual-kit
      - run: npm install --prefix "$RUNNER_TEMP/visual-kit-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - run: npx --prefix "$RUNNER_TEMP/visual-kit-browser" playwright install --with-deps chromium
      - run: node tests/inspect_visual_kit.mjs "$RUNNER_TEMP/visual-kit-browser-evidence"
        env:
          SLIDEGENAI_PLAYWRIGHT: ${{ runner.temp }}/visual-kit-browser/node_modules/playwright/index.mjs
